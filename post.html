---
layout: default
---
<main class="container article-wrap"><article class="article">
<p class="date">{{ page.date | date: "%d %B %Y" }}</p><h1>{{ page.title }}</h1>
{% if page.image %}<img class="hero" src="{{ page.image }}" alt="{{ page.title }}">{% endif %}
<div class="article-body">{{ content }}</div>
</article></main>
